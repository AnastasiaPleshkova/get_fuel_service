server:
  shutdown: graceful

spring:
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:10}
      max-lifetime: 1740000
  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/master.xml

job:
  some-job:
    enabled: ${SOME_JOB_ENABLED:false}
    cron: ${SOME_JOB_CRON}

rest:
  url:
  connectTimeout: 5000
  readTimeout: 5000

logging:
  level:
    root: INFO

security:
  enable: ${AUTH_SECURITY_ENABLED:false}

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  users:
    url: ${KEYCLOAK_USERS_URL}
    realm: ${KEYCLOAK_USERS_REALM}
    client-id: ${KEYCLOAK_USERS_CLIENT_ID}
    client-secret: ${KEYCLOAK_USERS_CLIENT_SECRET}
